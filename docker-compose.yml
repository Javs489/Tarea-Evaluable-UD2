version: '3.8'

services:
  mariadb_core:
    image: mariadb:latest
    container_name: mariadb_fintech_core
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: toor
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts:/docker-entrypoint-initdb.d 
      - ./config/99-custom.cnf:/etc/mysql/conf.d/99-custom.cnf:ro
    networks:
      fintech_net:
        ipv4_address: 172.18.0.2

  postgres_analitica:
    image: postgres:15-alpine
    container_name: postgres_fintech_analitica
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres2026
      POSTGRES_DB: finanzas_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      fintech_net:
        ipv4_address: 172.18.0.3

volumes:
  mariadb_data:
    name: mariadb_data
  postgres_data:
    name: postgres_data

networks:
  fintech_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1